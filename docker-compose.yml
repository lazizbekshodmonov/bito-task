services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsrs_db
      POSTGRES_PASSWORD: dsrs_db
      POSTGRES_DB: dsrs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NODE_ENV: production
      JWT_SECRET: your-jwt-secret
      HASH_SECRET: your-hash-secret
      CORS_ORIGIN_LOCAL_FRONTEND: http://localhost
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
