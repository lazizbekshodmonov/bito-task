services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    ports:
      - "9080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "9090:80"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
